metadata:
  name: OBAC Demo Policy
  description: Ownership Based Access Control Demo Policy
policies:
  accessControlPolicy:
    accessControlRules:
      - name: Rule 1
        action: Permit
        blockchain: Ethereum
        accessAddresses:
          - 0xb794f5ea0ba39494ce839613fffba74279579268
          - 0x4279579268b794f5ea0ba39494ce839613fffba7
        ownershipConstraints:
          - smartContract: 0x268b794f5ea0ba39494ce839613fffba74279579
          - smartContract: 0xa39494ce839613fffba74279579268b794f5ea0b
            metadataConstraints:
              - claim: ticketType
                operator: equals
                value:
                  - VIP
                  - Basic
              - claim: zone
                operator: notEquals
                value:
                  - 3
              - claim: hasDinner
                operator: equals
                value:
                  - True
